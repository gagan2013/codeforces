<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><title>Sun &amp; Moon Breathing</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>html,body{margin:0;height:100%;background:#0b0d14;overflow:hidden}canvas{display:block}</style></head><body><canvas id="c"></canvas>
<script>
const C=document.getElementById('c'),X=C.getContext('2d');let W,H;
const rs=()=>{W=C.width=innerWidth;H=C.height=innerHeight};rs();addEventListener('resize',rs);
const cl=(x,a=0,b=1)=>Math.min(b,Math.max(a,x)),L=(a,b,t)=>a+(b-a)*t,ez=t=>t*t*(3-2*t),rn=Math.random;
const EL={sun:{c:'#ff9d1f',k:'#fff1a8',n:'SUN'},moon:{c:'#8f6bff',k:'#e9e2ff',n:'MOON'}};
let el='sun',tc=0,hs=0,shake=0,T=0,over=false,chain=0,chainT=0,ult=null,msgT=0,msgS='',msgC='#fff',lb=0;
// ---------- flipbook slash sheets (4x2 atlas): Sun = flame arc + tongues, Moon = solid crescent ----------
function sheet(k){const c=document.createElement('canvas');c.width=1024;c.height=512;const x=c.getContext('2d'),E_=EL[k];
for(let i=0;i<8;i++){const p=i/7;x.save();x.translate((i%4)*256+128,(i>>2)*256+170);x.lineCap='round';
const a0=Math.PI*1.1,sw=Math.PI*.8*Math.min(1,p*1.8+.15);x.globalAlpha=1-p*.75;
if(k==='moon'){x.fillStyle=E_.c;x.beginPath();x.arc(0,0,105,a0,a0+sw);x.arc(0,26*(1-p*.5),92,a0+sw,a0,true);x.closePath();x.fill();
x.strokeStyle=E_.k;x.lineWidth=4;x.beginPath();x.arc(0,0,108,a0,a0+sw);x.stroke()}
else{x.strokeStyle=E_.c;x.lineWidth=34*(1-p*.5);x.beginPath();x.arc(0,0,92,a0,a0+sw);x.stroke();
x.strokeStyle=E_.k;x.lineWidth=10;x.beginPath();x.arc(0,0,92,a0,a0+sw);x.stroke();
x.strokeStyle=E_.c;x.lineWidth=5;for(let j=0;j<22;j++){const a=a0+sw*rn(),l=16+rn()*40*(1-p*.4);x.beginPath();x.moveTo(Math.cos(a)*108,Math.sin(a)*108);x.lineTo(Math.cos(a)*(108+l),Math.sin(a)*(108+l)-l*.5);x.stroke()}}
x.restore()}return c}
const SHT={sun:sheet('sun'),moon:sheet('moon')},FLP=[],PT=[],PR=[],G=[];
function flip(x,y,sc){FLP.push({x,y,sc,rot:(rn()-.5)*1.4,t:0,el})}
function emit(x,y,n,s,c){for(let i=0;i<n;i++){const a=rn()*6.28,v=rn()*s;PT.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v-s*.25,l:.5+rn()*.5,c})}if(PT.length>900)PT.splice(0,PT.length-900)}
// ---------- fighters ----------
const mkF=(col,hair,ai,maxHp=100)=>({x:0,y:0,vy:0,kx:0,face:1,hp:maxHp,maxHp,mp:0,st:'idle',t:0,cd:0,sd:0,fl:0,atk:null,buf:false,arm:.5,col,hair,ai,mode:'c',th:1,left:0,dv:{x:1,y:0},tr:[],burn:0,dist:400});
const P=mkF('#1f6b4a','#2a1a1a',0,100),E=mkF('#4a1f3a','#8a2030',1,300);
const LA=[{d:.34,dm:4,r:110,a:[-1.6,.6]},{d:.32,dm:4,r:110,a:[1,-1.2]},{d:.36,dm:5,r:120,a:[-.6,.8]},{d:.5,dm:8,r:140,a:[-2.4,1.4]}],HA={d:.85,dm:12,r:150,a:[-2.6,1.5]};
const gain=(f,x)=>f.mp=Math.min(100,f.mp+x),msg=(t,c='#fff')=>{msgS=t;msgC=c;msgT=1.3};
const sw=f=>{const sx=f.x+f.face*8,sy=f.y-70,dx=Math.cos(f.arm)*f.face,dy=Math.sin(f.arm),hx=sx+dx*22,hy=sy+dy*22;return{sx,sy,hx,hy,tx:hx+dx*95,ty:hy+dy*95,bx:hx+dx*25,by:hy+dy*25}};
const tcol=f=>f===P?EL[el].c:'#c04bff';
function atk(f,t,i){f.st='atk';f.t=0;f.atk={type:t,i,hit:false};f.buf=false}
function dash(f,c){let dx=c.x,dy=c.y;const m=Math.hypot(dx,dy);if(m<.1){dx=f.face;dy=0}else{dx/=m;dy/=m}
f.dv={x:dx,y:dy};f.st='dash';f.t=0;f.cd=.55;f.atk=null;f.vy=0;emit(f.x,f.y-50,18,260,tcol(f))}
// ---------- damage / parry / guard-break ----------
function hurt(d,a,dm,type,fin){
if(d.st==='ult'||d.st==='frozen')return;
if(d.st==='dash'&&d.t<.12){if(d===P)msg('DODGE','#8ff');return}
const mx=d.x,my=d.y-55,hv=type==='H'||fin,col=tcol(a);
if(d.st==='parry'){if(type!=='P'){a.st='stun';a.t=0;a.sd=1.1;a.atk=null;a.kx=-a.face*250}gain(d,25);hs=.15;shake=14;emit(mx,my,30,420,'#fff');flip(mx,my,260);if(d===P)msg('PARRY!','#ffe14a');return}
if(d.st==='guard'){if(type==='H'){d.st='stun';d.t=0;d.sd=1.3;d.atk=null;d.hp-=dm*.6;gain(a,10);hs=.16;shake=16;emit(mx,my,40,500,'#f44');flip(mx,my,300);msg('GUARD BREAK!','#f55')}
else{d.hp-=dm*.15;d.kx=a.face*160;gain(d,3);emit(mx,my,8,200,'#ccc');hs=.03}return}
d.hp=Math.max(0,d.hp-dm);const armor=d.atk&&d.atk.type==='H'&&type==='L';
if(!armor){d.st='stun';d.t=0;d.sd=hv?.7:.3;d.atk=null;d.kx=a.face*(hv?600:180)}

if(a===P){chain++;chainT=1.8;if(el==='sun')d.burn=3}}
// ---------- AI ----------
function ai(f,o,dt){const c={x:0,y:0,L:0,H:0,Pa:0,Pk:0,D:0,j:0};f.th-=dt;
if(f.mode==='g'){c.Pk=1;if(f.th<=0)f.mode='c'}
if(f.st==='idle'&&f.mode==='c'){
if(f.dist>150)c.x=f.face;
else if(f.th<=0){const r=rn();f.th=1+rn();
if(r<.5){f.left=Math.floor(rn()*4);c.L=1}else if(r<.68)c.H=1;else if(r<.84){c.Pa=1;c.Pk=1;f.mode='g';f.th=.9}else{c.D=1;c.x=-f.face;c.y=rn()<.4?-1:0}}
else c.x=f.dist<100?-f.face:0;
if(o.st==='atk'&&f.dist<170&&rn()<.012)c.Pa=1}
if(f.st==='atk'&&f.atk.type==='L'&&f.left>0)c.L=1;return c}
// ---------- fighter update ----------
function upd(f,o,dt,c){
f.t+=dt;f.cd-=dt;const dx=o.x-f.x;f.dist=Math.abs(dx);if(f.dist>2)f.face=dx>0?1:-1;

switch(f.st){
case'idle':{f.x+=c.x*(f.ai?190:300)*dt;if(c.j&&f.y>=0)f.vy=-820;
if(c.D&&f.cd<=0)dash(f,c);else if(c.H)atk(f,'H',0);else if(c.L)atk(f,'L',0);else if(c.Pa){f.st='parry';f.t=0}
pose=.5+Math.sin(T*3)*.08;break}
case'atk':{const a=f.atk,A=a.type==='H'?HA:LA[a.i],d=A.d*(f.ai?1.3:1),p=f.t/d,big=a.type==='H'||a.i===3,reach=A.r*(f===P&&el==='moon'?1.3:1),[a0,a1]=A.a;let r;
if(p<.35)r=L(.5,a0,p/.35);else if(p<.6)r=L(a0,a1,ez((p-.35)/.25));else r=L(a1,.5,cl((p-.6)/.4));
f.arm=r;pose=null;on=p>.3&&p<.8;if(p<.5&&f.dist>70)f.x+=f.face*(big?350:480)*dt;
if(!a.hit&&p>=.5){a.hit=true;if(f.dist<=reach&&Math.abs(o.y-f.y)<95)hurt(o,f,A.dm*(f===P&&el==='sun'?1.15:1),a.type,a.i===3);if(f.st!=='atk')break;
if(f===P&&el==='moon'&&big)PR.push({x:f.x+f.face*60,y:f.y-60,vx:f.face*650,o:f,l:1.3,dm:6,face:f.face})}
if(c.L&&p>.2)f.buf=true;
if(c.D&&f.cd<=0&&a.hit){dash(f,c);break}
if(c.H&&a.hit&&a.type==='L'&&!f.ai){atk(f,'H',0);break}
if(p>=1){if(a.type==='L'&&f.buf&&a.i<3){if(f.ai)f.left--;atk(f,'L',a.i+1)}else{f.st='idle';f.t=0;f.cd=.12}}break}
case'dash':{const s=f===P&&tc>0?1400:1000;if(!(f.dist<60&&f.dv.x*f.face>.3))f.x+=f.dv.x*s*dt;f.y=Math.min(0,f.y+f.dv.y*s*dt);on=true;pose=0;
emit(f.x,f.y-50,2,60,tcol(f));if(f.t>.2){f.st='idle';f.t=0;f.vy=0}break}
case'parry':pose=-1.3;if(f.t>=.22){f.st=c.Pk?'guard':'recover';f.t=0}break;
case'guard':pose=-1.3;if(!c.Pk){f.st='idle';f.t=0}break;
case'recover':pose=1;if(f.t>.28){f.st='idle';f.t=0}break;
case'stun':pose=1.3;if(f.t>f.sd){f.st='idle';f.t=0}break}

if(f.st!=='dash'){f.vy+=2300*dt;f.y+=f.vy*dt;if(f.y>=0){f.y=0;f.vy=0}}
f.x=cl(f.x,-720,720);
const s=sw(f);if(on){f.tr.unshift(s);if(f.tr.length>18)f.tr.pop()}else f.tr.pop();
f.fl=Math.max(0,f.fl-dt*6)}
// ---------- Ultimate Art (Sun: Hinokami Kagura / Moon: Crescent Dance) ----------
const UT=[.7,.95,1.2,1.45,1.7,2.2];
function ultStart(){P.mp=0;P.st='ult';P.atk=null;ult={t:0,n:0};E.st='frozen';E.atk=null;hs=.4;shake=14;
msg(el==='sun'?'SUN BREATHING — HINOKAMI KAGURA':'MOON BREATHING — CRESCENT DANCE',EL[el].k)}
function ultUpd(dt){ult.t+=dt;const em={x:E.x,y:E.y-55};
if(ult.t>.6){const s=sw(P);P.tr.unshift(s);if(P.tr.length>18)P.tr.pop();emit(s.tx,s.ty,3,120,EL[el].c)}else P.tr.pop();
while(ult.n<6&&ult.t>=UT[ult.n]){const n=ult.n++,fin=n===5,side=n%2?1:-1;
P.x=E.x+side*(fin?130:100);P.y=Math.min(0,E.y)-(n%3===2?80:0);P.face=-side;P.arm=-.5+rn()*1.2;
E.hp=Math.max(0,E.hp-(fin?15:4));E.fl=1;hs=fin?.4:.05;shake=fin?30:12;
flip(em.x,em.y,fin?700:380);if(n%2)flip(em.x,em.y,260);emit(em.x,em.y,fin?90:25,fin?700:420,EL[el].c);emit(em.x,em.y,fin?40:10,fin?500:250,'#fff')}
if(ult.t>2.9){P.st='idle';P.t=0;E.st='stun';E.t=0;E.sd=1.3;E.kx=P.face*900;ult=null}}
// ---------- drawing (cel look: flat fills, 2-tone shadow band, thick black ink outline) ----------
function drawF(f,al=1){X.save();X.globalAlpha=al;X.translate(f.x,f.y);X.scale(f.face,1);X.rotate(f.st==='stun'?-.25:f.st==='dash'?.2:0);
X.lineJoin='round';X.lineWidth=5;X.strokeStyle='#05050a';
const fill=(c,x,y,w,h)=>{X.fillStyle=f.fl>.3?'#fff':c;X.fillRect(x,y,w,h);X.strokeRect(x,y,w,h);X.fillStyle='rgba(0,0,0,.3)';X.fillRect(x,y,w*.4,h)};
fill('#1a1a2a',-15,-36,30,36);fill(f.col,-18,-82,36,48);fill('#eee',-19,-48,38,8);
X.beginPath();X.arc(0,-98,15,0,7);X.fillStyle=f.fl>.3?'#fff':'#ffd9c0';X.fill();X.stroke();
X.fillStyle='rgba(0,0,0,.18)';X.beginPath();X.arc(0,-98,15,Math.PI*.6,Math.PI*1.4);X.fill();
X.fillStyle=f.hair;X.beginPath();X.arc(0,-101,16,Math.PI,0);X.fill();X.stroke();X.fillStyle='#111';X.fillRect(5,-100,4,7);X.restore();
const s=sw(f);X.save();X.globalAlpha=al;X.lineCap='round';X.lineJoin='round';
X.strokeStyle='#05050a';X.lineWidth=11;X.beginPath();X.moveTo(s.sx,s.sy);X.lineTo(s.hx,s.hy);X.lineTo(s.tx,s.ty);X.stroke();
X.strokeStyle=f.col;X.lineWidth=6;X.beginPath();X.moveTo(s.sx,s.sy);X.lineTo(s.hx,s.hy);X.stroke();
X.strokeStyle=f===P?EL[el].c:'#c04bff';X.lineWidth=6;X.beginPath();X.moveTo(s.bx,s.by);X.lineTo(s.tx,s.ty);X.stroke();X.restore()}
function drawTr(f,col,core){const t=f.tr;if(t.length<2)return;X.globalCompositeOperation='lighter';
for(let i=0;i<t.length-1;i++){const a=t[i],b=t[i+1],al=(1-i/t.length)*.85;X.globalAlpha=al;X.fillStyle=col;X.beginPath();X.moveTo(a.tx,a.ty);X.lineTo(b.tx,b.ty);X.lineTo(b.bx,b.by);X.lineTo(a.bx,a.by);X.closePath();X.fill();
X.strokeStyle=core;X.lineWidth=3;X.beginPath();X.moveTo(a.tx,a.ty);X.lineTo(b.tx,b.ty);X.stroke()}X.globalAlpha=1;X.globalCompositeOperation='source-over'}
const ST=Array.from({length:70},()=>[rn(),rn()*.55,rn()*2+1]);
function bg(){const g=X.createLinearGradient(0,0,0,H);g.addColorStop(0,'#141230');g.addColorStop(1,el==='sun'?'#5a2f3a':'#2f2b58');X.fillStyle=g;X.fillRect(0,0,W,H);
X.fillStyle='#fff8';ST.forEach(s=>X.fillRect(s[0]*W,s[1]*H,s[2],s[2]));
const cx=W*.75-cam.x*.05,cy=H*.22,gr=X.createRadialGradient(cx,cy,10,cx,cy,170);gr.addColorStop(0,EL[el].c+'cc');gr.addColorStop(1,'#0000');X.fillStyle=gr;X.fillRect(cx-170,cy-170,340,340);
X.fillStyle=EL[el].k;X.beginPath();X.arc(cx,cy,58,0,7);X.fill();if(el==='moon'){X.fillStyle='#2f2b58';X.beginPath();X.arc(cx+22,cy-8,50,0,7);X.fill()}}
// ---------- input / camera / loop ----------
const K={},pr={};
addEventListener('keydown',e=>{if(!K[e.code])pr[e.code]=1;K[e.code]=1;if(e.code==='Space')e.preventDefault()});addEventListener('keyup',e=>K[e.code]=0);
const pc=()=>({x:(K.KeyD?1:0)-(K.KeyA?1:0),y:(K.KeyS?1:0)-(K.KeyW?1:0),j:pr.KeyW,L:pr.KeyJ,H:pr.KeyK,Pa:pr.KeyF,Pk:K.KeyF,D:pr.Space});
const cam={x:0,y:-60,z:1};
function reset(){[P,E].forEach(f=>{f.hp=f.maxHp;f.mp=0;f.st='idle';f.t=0;f.atk=null;f.kx=0;f.y=0;f.vy=0;f.fl=0;f.mode='c';f.th=1;f.left=0;f.burn=0;f.tr=[]});P.x=-250;E.x=250;over=false;tc=0;ult=null;chain=0;PR.length=0;msgT=0}
reset();let last=performance.now(),gt=0;
function loop(now){requestAnimationFrame(loop);const raw=Math.min(.05,(now-last)/1000);last=now;let dt=raw;T+=raw;
if(pr.Digit1)el='sun';if(pr.Digit2)el='moon';if(over&&pr.Enter)reset();
if(!over&&!ult&&P.st!=='stun'){if(pr.KeyQ&&tc<=0&&P.mp>=40){P.mp-=40;tc=6;msg('TOTAL CONCENTRATION',EL[el].k);emit(P.x,P.y-50,60,500,EL[el].c)}
if(pr.KeyR&&P.mp>=100&&(P.st==='idle'||P.st==='atk'))ultStart()}
if(hs>0){hs-=raw;dt=0}
if(dt>0&&!over){if(tc>0){tc-=dt;gt-=dt;if(gt<=0){gt=.04;G.push({...P,a:.5,fl:0})}}

const sx=P.x-E.x;if(Math.abs(sx)<50&&P.st!=='ult'){const m=(50-Math.abs(sx))/2*(sx>=0?1:-1);P.x+=m;E.x-=m}
for(let i=PR.length-1;i>=0;i--){const p=PR[i],e=E;p.x+=p.vx*dt;p.l-=dt;if(Math.abs(p.x-e.x)<40&&Math.abs(p.y-(e.y-50))<70){hurt(e,p.o,p.dm,'P',false);PR.splice(i,1)}else if(p.l<=0)PR.splice(i,1)}
[P,E].forEach(f=>{if(f.burn>0){f.burn-=dt;f.hp=Math.max(0,f.hp-4*dt);if(rn()<.5)emit(f.x,f.y-60,1,120,'#ff8a1f')}});
if(P.hp<=0||E.hp<=0){over=true;ult=null;const w=E.hp<=0;msg(w?'VICTORY — press Enter':'DEFEATED — press Enter',w?'#ffd24a':'#f66')}}
chainT-=raw;if(chainT<=0)chain=0;msgT-=raw;
FLP.forEach(f=>f.t+=raw);for(let i=FLP.length-1;i>=0;i--)if(FLP[i].t>.32)FLP.splice(i,1);
PT.forEach(p=>{p.x+=p.vx*raw;p.y+=p.vy*raw;p.vy+=400*raw;p.l-=raw});for(let i=PT.length-1;i>=0;i--)if(PT[i].l<=0)PT.splice(i,1);
G.forEach(g=>g.a-=raw*2);while(G.length&&G[0].a<=0)G.shift();
let tx,ty,tz;if(ult){const first=ult.t<.7;tx=first?P.x:E.x;ty=(first?P.y:E.y)-60;tz=first?2.2:1.8}
else{const d=Math.abs(P.x-E.x),dy=Math.abs(P.y-E.y);tz=cl(Math.min(W/(d+520),H/(dy+420)),.5,1.3);tx=(P.x+E.x)/2;ty=(P.y+E.y)/2-70}
const k=1-Math.exp(-(ult?12:6)*raw);cam.x=L(cam.x,tx,k);cam.y=L(cam.y,ty,k);cam.z=L(cam.z,tz,k);
X.setTransform(1,0,0,1,0,0);bg();X.save();X.translate(W/2+(rn()-.5)*shake,H*.62+(rn()-.5)*shake);shake*=.88;X.scale(cam.z,cam.z);X.translate(-cam.x,-cam.y);
X.fillStyle='#2a1f3a';for(let i=-4;i<=4;i++){X.fillRect(i*400-22,-300,44,300);X.fillStyle='#ffd080';X.beginPath();X.arc(i*400,-312,14,0,7);X.fill();X.fillStyle='#2a1f3a'}
X.fillStyle='#34305a';X.fillRect(-1600,0,3200,900);X.fillStyle='#4a4580';X.fillRect(-1600,0,3200,12);X.fillStyle='#05050a';X.fillRect(-1600,-3,3200,5);
G.forEach(g=>drawF(g,g.a*.6));drawF(E);drawF(P);drawTr(P,EL[el].c,EL[el].k);drawTr(E,'#c04bff','#f0d0ff');
PR.forEach(p=>{X.save();X.translate(p.x,p.y);X.scale(p.face,1);X.fillStyle=EL.moon.c;X.strokeStyle=EL.moon.k;X.lineWidth=4;X.beginPath();X.arc(0,0,44,-1.2,1.2);X.arc(16,0,38,1.2,-1.2,true);X.closePath();X.fill();X.stroke();X.restore()});
X.globalCompositeOperation='lighter';
FLP.forEach(f=>{const fr=Math.min(7,Math.floor(f.t/.32*8)),s=f.sc/256;X.save();X.translate(f.x,f.y);X.rotate(f.rot);X.scale(s,s);X.drawImage(SHT[f.el],(fr%4)*256,(fr>>2)*256,256,256,-128,-170,256,256);X.restore()});
PT.forEach(p=>{X.globalAlpha=cl(p.l*2);X.fillStyle=p.c;X.fillRect(p.x-3,p.y-3,6,6)});X.globalAlpha=1;X.globalCompositeOperation='source-over';X.restore();
// ----- HUD -----
X.setTransform(1,0,0,1,0,0);const bw=Math.min(420,W*.4);
const bar=(x,y,w,h,f,c,r)=>{X.fillStyle='#0009';X.fillRect(x,y,w,h);X.fillStyle=c;X.fillRect(r?x+w*(1-f):x,y,w*f,h);X.strokeStyle='#fff';X.lineWidth=2;X.strokeRect(x,y,w,h)};
